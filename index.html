<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pro Metronome</title>
<style>
:root{--bg:#333639;--bar:#3f4245;--card:#404347;--btn:#74777a;--acc:#d97a35;--rod:#e6a56a;--mute:#9aa0a8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{background:var(--bg)}
@media(max-width:500px){html{background:linear-gradient(var(--bar) 0 calc(env(safe-area-inset-top,0px) + 66px),var(--bg) 0)}}
@media(min-width:501px){body{border-left:1px solid #4a4d51;border-right:1px solid #4a4d51}}
html,body{height:100%;margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .1s,opacity .15s}
button:active{transform:scale(.94)}
.bar{display:flex;justify-content:space-around;align-items:center;background:var(--bar);padding:10px 8px;border-bottom:1px solid #4a4d51}
.ib{display:flex;align-items:center;justify-content:center;width:48px;height:44px;border:1.5px solid #fff;border-radius:9px;font-size:13px;font-weight:600}
.ib.on{background:var(--acc);border-color:var(--acc)}
.ib svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.6}
.stage{flex:1;min-height:120px;position:relative;margin:14px 0 6px;touch-action:none;cursor:ns-resize}
.rod{position:absolute;left:50%;bottom:0;width:10px;height:100%;margin-left:-5px;background:var(--rod);border-radius:5px 5px 0 0;transform-origin:50% 100%;will-change:transform}
.knob{position:absolute;left:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;box-shadow:-5px 5px 10px rgba(0,0,0,.35)}
.info{text-align:center}
#tname{color:var(--mute);font-size:24px;font-weight:300;height:30px}
#unit{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.rb{width:56px;height:56px;border:1.5px solid #fff;border-radius:50%;font-size:34px;font-weight:200;line-height:1}
#bpm{font-size:92px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1;min-width:150px}
#dots{display:flex;justify-content:space-around;padding:6px 22px 0;height:44px;align-items:center}
.d{width:18px;height:18px;border-radius:50%;border:1.5px solid #fff;transition:background .08s}
.d.on{background:#fff}.d.on.acc{background:var(--acc);border-color:var(--acc)}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 12px;color:#fff}
.ts{font:700 26px/0.9 "Bodoni 72",Didot,Georgia,serif;text-align:center}
.ts i{display:block;font-style:normal}
.ctl svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6}
#go{margin:0 16px 18px;height:62px;border:1.5px solid #fff;border-radius:16px;font-size:26px;letter-spacing:1px;width:calc(100% - 32px)}
#go.on{background:var(--acc);border-color:var(--acc)}
#fl{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:10;display:none;align-items:center;justify-content:center;padding:14px}
.mod.show{display:flex}
.sheet{background:#383b3f;border-radius:22px;padding:14px;width:100%;max-width:440px;max-height:96%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pan{background:var(--card);border-radius:20px;padding:10px;display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.tsb{aspect-ratio:1;border-radius:50%;background:var(--btn);font:700 26px/.9 "Bodoni 72",Didot,Georgia,serif;color:#e9e9e9}
.tsb.on,.pb.on{background:#cc7a38}
.sb{height:62px;display:flex;align-items:center;justify-content:center;color:#777a7d}
.sb.on{color:#f0f0f0}.sb svg{height:36px;fill:currentColor}
.pb{height:52px;border-radius:8px;background:#7a7d80;font-size:19px}
.pb.on{font-weight:700}
.chk{display:flex;align-items:center;gap:12px;font-size:19px}
.chk input{width:26px;height:26px;accent-color:var(--acc)}
.ok{height:58px;border-radius:16px;background:#d97a35;font-size:24px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.fld input[type=number]{background:#2b2d30;border:1px solid #55585c;border-radius:10px;padding:10px;color:#fff;font-size:17px}
.fld input[type=range]{accent-color:var(--acc)}
h3{margin:0;font-size:18px}
.vrow{display:flex;align-items:center;gap:12px;padding:0 24px 14px}.vrow svg{width:24px;height:24px;flex:none;stroke:var(--mute);fill:none;stroke-width:1.6}.vrow input{flex:1;accent-color:var(--acc);height:28px}.vrow b{width:44px;text-align:right;font-size:13px;color:var(--mute);font-weight:500}
.vrow,#fs{display:none}
@media (hover:hover) and (pointer:fine){
body{max-width:none;border:0}
.vrow{display:flex}#fs{display:flex}
.bar{justify-content:center;gap:28px}
.info,#dots,.ctl,.vrow{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
#go{max-width:640px;width:calc(100% - 32px);margin:0 auto 24px}
#bpm{font-size:120px}#tname{font-size:28px}
.stage{margin:20px 0 10px}.rod{width:12px;margin-left:-6px}.knob{width:64px;height:64px;margin:-32px 0 0 -32px}
}
</style></head><body>
<div id="fl"></div>
<div class="bar">
 <button class="ib" id="tuner" aria-label="A440 reference tone">A440</button>
 <button class="ib" id="tap" aria-label="Tap tempo">TAP</button>
 <button class="ib" id="fs" aria-label="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 <button class="ib" id="gear" aria-label="Settings and timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></button>
</div>
<div class="stage" id="stage"><div class="rod" id="rod"><div class="knob" id="knob"></div></div></div>
<div class="info">
 <div id="tname"></div>
 <div class="row">
  <button class="rb" id="minus" aria-label="Slower">&minus;</button>
  <div><div id="bpm">60</div></div>
  <button class="rb" id="plus" aria-label="Faster">+</button>
 </div>
 <div><span id="unit"></span> <span id="tleft" style="color:var(--acc);margin-left:8px"></span></div>
</div>
<div id="dots"></div>
<div class="ctl">
 <button class="ts" id="tsb"><i id="tt">4</i><i id="tbm">4</i></button>
 <button id="snd" style="display:flex;align-items:center;gap:6px;font-size:15px"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zM16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12"/></svg><span id="sname">Click</span></button>
 <button id="flb" aria-label="Visual flash"><svg viewBox="0 0 24 24"><circle id="flc" cx="12" cy="12" r="8"/></svg></button>
 <button id="acb" aria-label="Accent first beat"><svg viewBox="0 0 24 24"><path d="M12 3L2.5 20h19L12 3z"/></svg></button>
 <button id="chev" aria-label="Rhythm settings"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
</div>
<div class="vrow"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zM16 8.5a5 5 0 010 7"/></svg><input type="range" id="vol2" min="0" max="1.3" step=".01" aria-label="Volume"><b id="vt2"></b></div>
<button id="go">START</button>

<div class="mod" id="m1"><div class="sheet">
 <div class="pan g4" id="gts"></div>
 <div class="pan g4" id="gsub"></div>
 <label class="chk"><input type="checkbox" id="chk"> Add accent to the first beat</label>
 <div class="pan g4" id="gpre"></div>
 <button class="ok" id="ok1">OK</button>
</div></div>

<div class="mod" id="m2"><div class="sheet">
 <h3>Settings &amp; Practice</h3>
 <div class="fld"><span>Volume <b id="vt" style="color:#fff"></b></span><input type="range" id="vol" min="0" max="1.3" step=".01"></div>
 <div class="fld">Practice timer (minutes, 0 = off)<input type="number" id="tmin" min="0" max="180"></div>
 <label class="chk" style="font-size:16px"><input type="checkbox" id="inc"> Speed trainer</label>
 <div class="fld">Increase BPM by<input type="number" id="step" min="1" max="30"></div>
 <div class="fld">Every N bars<input type="number" id="bars" min="1" max="64"></div>
 <button class="ok" id="ok2">Done</button>
</div></div>

<script>

 'Latin':{ts:[4,4],s:3,p:clave([0,3,6,10,12])},'Custom':null};
const S={bpm:70,top:4,bot:4,sub:0,accent:true,snd:1,flash:true,pre:'Custom',pat:null,vol:.8,tmin:0,inc:false,bars:4,step:5,playing:false};

function build(){

 const dots=$('dots');dots.innerHTML='';for(let i=0;i<beats();i++){const d=document.createElement('div');d.className='d';dots.appendChild(d)}
 $('gts').innerHTML='';TS.forEach(([t,b])=>{const e=document.createElement('button');e.className='tsb'+(t===S.top&&b===S.bot?' on':'');e.innerHTML=`<i style="display:block;font-style:normal">${t}</i><i style="display:block;font-style:normal">${b}</i>`;e.onclick=()=>{S.top=t;S.bot=b;S.pre='Custom';S.pat=null;S.sub=Math.min(S.sub,subs().length-1);build();save()};$('gts').appendChild(e)});
 const ic=comp()?[[1,0,12,0,1],[3,1,12],[6,2,8]]:[[1,0,12],[2,1,12],[3,1,12,1],[4,2,12]];
 $('gsub').innerHTML='';ic.forEach((a,i)=>{const e=document.createElement('button');e.className='sb'+(i===S.sub?' on':'');e.innerHTML=note(a[0],a[1],a[2],a[3],a[4]);e.onclick=()=>{S.sub=i;S.pre='Custom';S.pat=null;build();save()};$('gsub').appendChild(e)});
 $('gpre').innerHTML='';Object.keys(PRE).forEach(k=>{const e=document.createElement('button');e.className='pb'+(S.pre===k?' on':'');e.textContent=k;e.style.fontSize='17px';e.onclick=()=>{const p=PRE[k];if(p){S.top=p.ts[0];S.bot=p.ts[1];S.sub=p.s;S.pat=p.p}else S.pat=null;S.pre=k;build();save()};$('gpre').appendChild(e)});
 $('chk').checked=S.accent;$('acb').style.opacity=S.accent?1:.45;$('flc').style.fill=S.flash?'#d97a35':'none';$('flc').style.stroke=S.flash?'#d97a35':'#fff';
}
$('chk').onchange=e=>{S.accent=e.target.checked;build();save()};
$('acb').onclick=()=>{S.accent=!S.accent;build();save()};
$('flb').onclick=()=>{S.flash=!S.flash;build();save()};
$('snd').onclick=()=>{S.snd=(S.snd+1)%SOUNDS.length;build();save();if(ctx&&!S.playing){voice(ctx.currentTime+.02,3)}else if(!ctx){init();voice(ctx.currentTime+.02,3)}};
$('go').onclick=()=>S.playing?stop():start();
$('plus').onclick=()=>setBpm(S.bpm+1);$('minus').onclick=()=>setBpm(S.bpm-1);
let rep;[['plus',1],['minus',-1]].forEach(([id,d])=>{const b=$(id);b.addEventListener('pointerdown',()=>{rep=setTimeout(function r(){setBpm(S.bpm+d);rep=setTimeout(r,70)},450)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(rep)))});
const st=$('stage');let drag=false;
function mv(y){const r=st.getBoundingClientRect(),p=Math.max(.06,Math.min(.94,(y-r.top)/r.height));setBpm(20+(p-.06)/.88*280)}
st.onpointerdown=e=>{drag=true;st.setPointerCapture(e.pointerId);mv(e.clientY)};st.onpointermove=e=>{if(drag)mv(e.clientY)};st.onpointerup=st.onpointercancel=()=>drag=false;
let taps=[];$('tap').onclick=()=>{const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);if(taps.length>6)taps.shift();if(taps.length>1)setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))};
const open=id=>$(id).classList.add('show'),shut=id=>$(id).classList.remove('show');
['tsb','chev'].forEach(i=>$(i).onclick=()=>open('m1'));$('ok1').onclick=()=>shut('m1');
$('gear').onclick=()=>{$('vol').value=S.vol;$('vt').textContent=Math.round(S.vol*100)+'%';$('tmin').value=S.tmin;$('inc').checked=S.inc;$('step').value=S.step;$('bars').value=S.bars;open('m2')};
function setVol(v){S.vol=v;const p=Math.round(v*100)+'%';$('vol').value=$('vol2').value=v;$('vt').textContent=$('vt2').textContent=p;if(master){master.gain.setTargetAtTime(v,ctx.currentTime,.01);dry.gain.setTargetAtTime(v,ctx.currentTime,.01)}save()}
$('vol').oninput=e=>setVol(+e.target.value);$('vol2').oninput=e=>setVol(+e.target.value);
setVol(S.vol);
$('ok2').onclick=()=>{S.tmin=Math.max(0,+$('tmin').value||0);S.inc=$('inc').checked;S.step=Math.max(1,+$('step').value||5);S.bars=Math.max(1,+$('bars').value||4);if(S.playing)t0=ctx.currentTime;save();shut('m2')};
document.querySelectorAll('.mod').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m)m.classList.remove('show')}));
document.addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('go').click()}
 else if(e.code==='ArrowUp'||e.code==='ArrowRight'){e.preventDefault();setBpm(S.bpm+(e.shiftKey?10:1))}
 else if(e.code==='ArrowDown'||e.code==='ArrowLeft'){e.preventDefault();setBpm(S.bpm-(e.shiftKey?10:1))}
 else if(e.code==='KeyT')$('tap').click();
 else if(e.code==='KeyF')toggleFS()});
function toggleFS(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
$('fs').onclick=toggleFS;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.playing)wl(true)});
S.sub=Math.min(S.sub,subs().length-1);build();setBpm(S.bpm);
</script></body></html>
